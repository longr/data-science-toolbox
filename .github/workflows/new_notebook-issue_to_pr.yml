# This file was created automatically with `jupyter-book init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: Submit a new notebook
on:
  issues:
    types: [labeled]

jobs:
  create-pr:
    # Only runif the notebook has the label "notebook inclusion"
    if: contains(github.event.issue.labels.*.name, 'notebook inclusion')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        
      - name: Append Repository Details to notebook.yml
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          # 1. Add a leading newline before the block
          echo "" >> notebooks.yml
          # 2.1 Slice out Repository Details
          # 2.2. Skip empty lines or lines matching 'notebooks:'
          # 2.3. Indent remaining lines by 2 spaces
          echo "$BODY" | awk '
            /### Repository Details/ { flag=1; next }
            /### / { flag=0 }
            flag && !/notebooks:/ && NF { print "  " $0 }
          ' >> notebooks.yml
          # 3. Add a trailing newline after the block
          echo "" >> notebooks.yml
          
      - name: Extract and Format Repo Name and Path
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          # 1. Isolate the '### Repository Details' block
          SECTION_BODY=$(echo "$BODY" | awk '/### Repository Details/{flag=1; next} /### /{flag=0} flag')

          # 2. Extract the URL from this section
          URL=$(echo "$SECTION_BODY" | grep -oE 'https?://[^ ]+' | head -n 1)

          # 3. Extract the 'path:' value (e.g., notebook.ipynb)
          PATH_VAL=$(echo "$SECTION_BODY" | awk -F'path:' '/path:/{print $2}' | xargs)

          # Strip trailing .git or trailing slashes from URL
          URL_CLEAN=$(echo "$URL" | sed 's/\.git$//' | sed 's/\/$//')

          # Get the raw repo name
          RAW_NAME=$(basename "$URL_CLEAN")

          # Strip existing 'ds-toolbox-notebook-' prefix if present
          CLEAN_NAME="${RAW_NAME#ds-toolbox-notebook-}"

          # Construct final string: ds-toolbox-notebook-<clean>/<path_value>
          FORMATTED_NAME="ds-toolbox-notebook-${CLEAN_NAME}/${PATH_VAL}"

          # Export to $GITHUB_ENV for subsequent workflow steps
          echo "FORMATTED_NAME=${FORMATTED_NAME}" >> $GITHUB_ENV
          
          echo "Extracted URL:  ${URL}"
          echo "Extracted Path: ${PATH_VAL}"
          echo "Formatted Name: ${FORMATTED_NAME}"

      - name: Append Path to myst.yml preserving exact formatting
        env:
          FORMATTED_PATH: ${{ env.FORMATTED_NAME }}
        run: |
          awk -v new_entry="        - file: methods/${FORMATTED_PATH}" '
            {
              # Track when we enter "Data Science Methods" section
              if ($0 ~ /title:[[:space:]]*Data Science Methods/) {
                in_target=1
              }

              # Track when we hit its "children:" array
              if (in_target && $0 ~ /children:/) {
                in_children=1
              }

              # Track if we leave "Data Science Methods" (hit next root key or title)
              if (in_target && $0 ~ /^  - title:/ && $0 !~ /Data Science Methods/) {
                in_target=0
                in_children=0
              }

              # If inside children, remember the last child line index and print as normal
              if (in_children && $0 ~ /^[[:space:]]+- file:/) {
                last_child_line = NR
              }

              lines[NR] = $0
            }

            END {
              for (i = 1; i <= NR; i++) {
                print lines[i]
                # Insert the new entry directly after the last child file entry
                if (i == last_child_line) {
                  print new_entry
                }
              }
            }
          ' myst.yml > myst.tmp && mv myst.tmp myst.yml
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Starting new notebook: generate base files for including new notebook described in issue #${{ github.event.issue.number }}"
          committer: "GitHub Actions Bot <actions@github.com>"
          author: "GitHub Actions Bot <actions@github.com>"
          title: "New notebook from Issue #${{ github.event.issue.number }}"
          body: "This is an initial PR triggered by Issue #${{ github.event.issue.number }}. Please check and test before merging"
          branch: "new_notebook-issue-${{ github.event.issue.number }}"
          delete-branch: false
          
